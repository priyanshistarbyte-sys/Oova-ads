<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Mobile utilities security campaign" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="mu_g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E8A76"/><stop offset="1" stop-color="#235544"/></linearGradient>
  </defs>
  <!-- backdrop blob -->
  <path d="M300 70 C 430 55 520 150 500 260 C 486 340 520 380 440 420 C 350 460 240 430 220 350 C 205 290 235 255 275 220 C 315 185 220 120 300 70 Z" fill="#EAF2EF"/>
  <g fill="#2E6E5E"><circle cx="440" cy="150" r="4"/><circle cx="456" cy="150" r="4"/><circle cx="472" cy="150" r="4"/><circle cx="440" cy="166" r="4"/><circle cx="456" cy="166" r="4"/><circle cx="472" cy="166" r="4"/></g>
  <polygon points="150,150 164,174 136,174" fill="none" stroke="#2E6E5E" stroke-width="2"/>
  <text x="470" y="360" font-size="24">🚀</text>

  <!-- phone -->
  <rect x="210" y="120" width="150" height="260" rx="26" fill="#1B1B1B"/>
  <rect x="220" y="130" width="130" height="240" rx="18" fill="url(#mu_g)"/>
  <rect x="262" y="140" width="46" height="7" rx="3.5" fill="#1B1B1B" opacity=".5"/>

  <!-- big padlock -->
  <rect x="230" y="250" width="150" height="110" rx="16" fill="#F2C94C"/>
  <path d="M250 250 v-26 a35 35 0 0 1 70 0 v26" fill="none" stroke="#1B1B1B" stroke-width="12"/>
  <circle cx="305" cy="300" r="20" fill="#1B1B1B"/>
  <path d="M305 300 L305 330 L318 342" fill="none" stroke="#F2C94C" stroke-width="7" stroke-linecap="round"/>

  <!-- shield with check -->
  <g transform="translate(150,230)">
    <path d="M0,-34 L28,-22 V6 C28,26 0,38 0,38 C0,38 -28,26 -28,6 V-22 Z" fill="#EAF2EF" stroke="#2E6E5E" stroke-width="3"/>
    <path d="M-11,2 L-3,10 L12,-8" fill="none" stroke="#2E6E5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- keys -->
  <g transform="translate(400,190) rotate(35)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#F2C94C" stroke-width="8"/>
    <rect x="-3" y="14" width="6" height="46" fill="#F2C94C"/>
    <rect x="3" y="44" width="12" height="6" fill="#F2C94C"/>
    <rect x="3" y="54" width="10" height="6" fill="#F2C94C"/>
  </g>
  <!-- gear + music + eye accents -->
  <g transform="translate(160,340)" fill="none" stroke="#2E6E5E" stroke-width="5"><circle r="16"/></g>
  <circle cx="150" cy="410" r="20" fill="#EAF2EF"/><path d="M143 410 l14 -8 v16 z" fill="#2E6E5E"/>
  <text x="120" y="120" font-size="20">🎵</text>
</svg>
