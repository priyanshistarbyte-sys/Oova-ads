<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Software campaign audience targeting" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="sw_g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E8A76"/><stop offset="1" stop-color="#235544"/></linearGradient>
  </defs>
  <!-- backdrop blob -->
