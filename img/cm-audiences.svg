  <text x="196" y="123" font-size="11" fill="#8A9793">My collected audiences</text>

  <text x="30" y="158" font-size="12" font-weight="700" fill="#5C6B66">Interests</text>
  <!-- interest tiles -->
  <g font-size="12" font-weight="600" fill="#1B1B1B">
