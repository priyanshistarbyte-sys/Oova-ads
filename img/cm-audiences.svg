    <g><rect x="155" y="168" width="115" height="44" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="169" y="194">Shopping</text><text x="248" y="196" font-size="16">🛍️</text></g>
    <g><rect x="280" y="168" width="115" height="44" rx="8" fill="#fff" stroke="#2E6E5E" stroke-width="2"/><text x="294" y="194" fill="#2E6E5E">Finance</text><text x="372" y="196" font-size="16">💳</text></g>
    <g><rect x="405" y="168" width="115" height="44" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="419" y="194">iGaming</text><text x="496" y="196" font-size="16">🎰</text></g>
    <g><rect x="30" y="220" width="115" height="44" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="44" y="246">Giveaways</text><text x="120" y="248" font-size="16">🎁</text></g>
    <g><rect x="155" y="220" width="115" height="44" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="169" y="246">Dating</text><text x="248" y="248" font-size="16">❤️</text></g>
    <g><rect x="280" y="220" width="115" height="44" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="294" y="246">Utilities</text><text x="372" y="248" font-size="16">🔧</text></g>
  </g>

  <text x="30" y="300" font-size="12" font-weight="700" fill="#5C6B66">Gender</text>
  <g font-size="12" font-weight="600" fill="#1B1B1B">
    <g><rect x="30" y="310" width="115" height="44" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="44" y="336">Men</text><text x="120" y="338" font-size="16">👨</text></g>
