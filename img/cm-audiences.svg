<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Audience targeting dashboard" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs><filter id="au_sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1B1B1B" flood-opacity=".1"/></filter></defs>
  <rect x="10" y="10" width="540" height="440" rx="18" fill="#fff" filter="url(#au_sh)"/>

  <!-- top bar -->
  <circle cx="40" cy="42" r="9" fill="#2E6E5E"/><text x="58" y="47" font-size="14" font-weight="800" fill="#1B1B1B">OOVA Ads</text>
  <line x1="24" y1="66" x2="536" y2="66" stroke="#EEF2F1" stroke-width="1.5"/>
  <text x="30" y="94" font-size="15" font-weight="800" fill="#1B1B1B">Audiences</text>

  <!-- tabs -->
