  <text x="30" y="392" font-size="12" font-weight="700" fill="#5C6B66">Age</text>
  <g font-size="12" fill="#5C6B66">
    <rect x="30" y="402" width="115" height="40" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="44" y="426">18-29</text>
    <rect x="155" y="402" width="115" height="40" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="169" y="426">30-49</text>
    <rect x="280" y="402" width="115" height="40" rx="8" fill="#F7FAF9" stroke="#E3E9E7"/><text x="294" y="426">50+</text>
