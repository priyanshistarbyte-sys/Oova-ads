<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Finance offers audience" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs><linearGradient id="fi_g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E8A76"/><stop offset="1" stop-color="#235544"/></linearGradient></defs>
  <!-- chart lines backdrop -->
  <g stroke="#CFE4DC" stroke-width="2"><line x1="120" y1="150" x2="440" y2="150"/><line x1="120" y1="180" x2="440" y2="180"/><line x1="120" y1="210" x2="440" y2="210"/><line x1="120" y1="240" x2="440" y2="240"/></g>
  <path d="M300 80 C 430 65 520 160 500 270 C 486 350 520 385 430 415 C 350 445 240 420 225 345 Z" fill="#EAF2EF" opacity=".7"/>

  <!-- star -->
  <path d="M170 120 l10 22 l24 3 l-17 17 l4 24 l-21 -12 l-21 12 l4 -24 l-17 -17 l24 -3 z" fill="#F2C94C" stroke="#1B1B1B" stroke-width="2"/>
  <!-- eye -->
  <g transform="translate(300,120)"><ellipse rx="22" ry="13" fill="none" stroke="#2E6E5E" stroke-width="3"/><circle r="6" fill="#2E6E5E"/></g>
  <polygon points="360,110 386,110 373,132" fill="#2E6E5E"/>
  <g fill="#2E6E5E"><circle cx="460" cy="170" r="4"/><circle cx="476" cy="170" r="4"/><circle cx="460" cy="186" r="4"/><circle cx="476" cy="186" r="4"/></g>

  <!-- magnifier over dollar -->
  <g transform="translate(210,250)"><circle r="34" fill="none" stroke="#2E6E5E" stroke-width="8"/><line x1="24" y1="24" x2="60" y2="60" stroke="#1B1B1B" stroke-width="8" stroke-linecap="round"/><circle cx="0" cy="0" r="16" fill="#F2C94C"/><text y="6" text-anchor="middle" font-size="16" font-weight="800">$</text></g>

  <!-- big dollar coin held up -->
  <circle cx="430" cy="250" r="52" fill="#F2C94C" stroke="#1B1B1B" stroke-width="3"/>
  <text x="430" y="272" text-anchor="middle" fill="#235544" font-size="52" font-weight="800">$</text>

  <!-- person in suit -->
  <g>
    <rect x="290" y="300" width="90" height="120" rx="22" fill="#2E6E5E"/>
    <path d="M320 300 L335 340 L350 300 Z" fill="#fff"/>
    <circle cx="335" cy="272" r="28" fill="#EBB98F"/>
    <path d="M307 268 C 307 242 363 242 363 268 C 363 254 351 248 335 248 C 319 248 307 254 307 268 Z" fill="#3E8A76"/>
    <!-- raised arm to coin -->
    <path d="M375 330 C 400 315 415 285 428 268" fill="none" stroke="#EBB98F" stroke-width="14" stroke-linecap="round"/>
    <!-- cash in other hand -->
    <g transform="translate(250,360)"><rect x="0" y="0" width="60" height="30" rx="3" fill="#3E8A76" stroke="#1B1B1B" stroke-width="2"/><circle cx="30" cy="15" r="9" fill="#EAF2EF"/><text x="30" y="20" text-anchor="middle" font-size="11" font-weight="800" fill="#235544">$</text></g>
  </g>
  <!-- credit cards -->
  <g transform="translate(410,360) rotate(-8)"><rect width="70" height="44" rx="6" fill="#EAF2EF" stroke="#1B1B1B" stroke-width="2"/><rect y="10" width="70" height="9" fill="#1B1B1B"/><rect x="8" y="28" width="30" height="6" rx="3" fill="#F2C94C"/></g>
  <circle cx="150" cy="330" r="24" fill="none" stroke="#2E6E5E" stroke-width="4"/><text x="150" y="338" text-anchor="middle" font-size="18" font-weight="800" fill="#2E6E5E">$</text>
</svg>
