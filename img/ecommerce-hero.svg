<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="eCommerce shopping audience" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs><linearGradient id="ec_g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E8A76"/><stop offset="1" stop-color="#235544"/></linearGradient></defs>
  <path d="M300 60 C 430 45 520 150 500 260 C 486 340 520 380 440 420 C 350 460 240 430 220 350 C 205 290 235 255 275 220 C 315 185 220 110 300 60 Z" fill="#EAF2EF"/>
  <circle cx="150" cy="220" r="30" fill="#2E6E5E"/><text x="150" y="230" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">%</text>
  <circle cx="470" cy="250" r="30" fill="#F2C94C"/><text x="470" y="260" text-anchor="middle" fill="#1B1B1B" font-size="26" font-weight="800">$</text>
  <text x="150" y="130" font-size="22">👁️</text>
  <g fill="#2E6E5E"><circle cx="430" cy="150" r="4"/><circle cx="446" cy="150" r="4"/><circle cx="430" cy="166" r="4"/><circle cx="446" cy="166" r="4"/></g>

  <!-- phone -->
  <rect x="180" y="120" width="150" height="250" rx="24" fill="#F2C94C"/>
  <rect x="190" y="130" width="130" height="230" rx="16" fill="url(#ec_g)"/>
  <!-- card on screen -->
  <rect x="210" y="160" width="70" height="44" rx="6" fill="#fff"/><rect x="216" y="170" width="40" height="7" rx="3.5" fill="#2E6E5E"/><rect x="216" y="184" width="52" height="7" rx="3.5" fill="#E3E9E7"/>

  <!-- BUY button -->
  <rect x="360" y="150" width="90" height="40" rx="10" fill="#fff" stroke="#2E6E5E" stroke-width="2"/><text x="405" y="176" text-anchor="middle" fill="#2E6E5E" font-size="16" font-weight="800">BUY</text>

  <!-- shopping cart -->
  <g stroke="#1B1B1B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 250 H400 L388 320 H272 Z"/>
    <line x1="250" y1="250" x2="238" y2="230"/>
    <path d="M262 260 v50 M290 260 v50 M318 260 v50 M346 260 v50 M374 260 v50"/>
  </g>
  <circle cx="280" cy="345" r="12" fill="none" stroke="#1B1B1B" stroke-width="4"/>
  <circle cx="372" cy="345" r="12" fill="none" stroke="#1B1B1B" stroke-width="4"/>
  <!-- person relaxing in cart -->
  <circle cx="330" cy="235" r="18" fill="#EBB98F"/>
  <path d="M312 232 C 312 214 348 214 348 232 C 348 222 340 218 330 218 C 320 218 312 222 312 232 Z" fill="#2E6E5E"/>
  <rect x="300" y="250" width="70" height="30" rx="14" fill="#3E8A76"/>

  <!-- shopping bags -->
  <g><rect x="410" y="330" width="44" height="52" rx="4" fill="#F2C94C"/><path d="M420 330 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#1B1B1B" stroke-width="3"/></g>
  <g><rect x="450" y="340" width="40" height="46" rx="4" fill="#EBB98F"/><path d="M459 340 v-7 a11 11 0 0 1 22 0 v7" fill="none" stroke="#1B1B1B" stroke-width="3"/></g>
</svg>
