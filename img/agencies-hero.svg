<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Agency team analysing growth" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="ag_g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E8A76"/><stop offset="1" stop-color="#235544"/></linearGradient>
  </defs>
  <!-- backdrop -->
  <path d="M250 60 C 380 40 500 120 490 250 C 484 330 520 380 440 420 C 350 460 230 430 200 350 C 175 285 210 250 250 210 C 290 170 200 110 250 60 Z" fill="#EAF2EF"/>
  <polygon points="140,120 154,144 126,144" fill="#2E6E5E" fill-opacity=".25"/>
  <text x="470" y="410" font-size="40" fill="#2E6E5E" font-weight="800">$</text>
  <circle cx="470" cy="395" r="34" fill="none" stroke="#2E6E5E" stroke-width="3"/>

  <!-- growth board with up arrow -->
  <rect x="150" y="120" width="150" height="180" rx="12" fill="#fff" stroke="#D7DEDC" stroke-width="2"/>
  <rect x="150" y="120" width="150" height="26" rx="12" fill="url(#ag_g)"/>
  <path d="M175 270 L175 220 M175 220 L165 232 M175 220 L185 232" fill="none" stroke="#2E6E5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2E6E5E"><rect x="205" y="240" width="14" height="30" rx="3"/><rect x="228" y="220" width="14" height="50" rx="3"/><rect x="251" y="200" width="14" height="70" rx="3"/></g>
  <polyline points="205,235 228,215 251,195 274,185" fill="none" stroke="#F2C94C" stroke-width="3" stroke-linecap="round"/>

  <!-- award badge -->
  <circle cx="360" cy="150" r="26" fill="#F2C94C"/>
  <circle cx="360" cy="150" r="17" fill="none" stroke="#1B1B1B" stroke-width="2"/>
  <text x="360" y="157" text-anchor="middle" font-size="16">★</text>
  <path d="M350 172 L346 196 L360 188 L374 196 L370 172 Z" fill="#2E6E5E"/>

  <!-- pie charts board -->
  <rect x="330" y="210" width="170" height="90" rx="12" fill="#fff" stroke="#D7DEDC" stroke-width="2"/>
  <g>
    <circle cx="370" cy="255" r="20" fill="#EAF2EF"/><path d="M370 255 L370 235 A20 20 0 0 1 388 264 Z" fill="#2E6E5E"/>
    <circle cx="415" cy="255" r="20" fill="#EAF2EF"/><path d="M415 255 L415 235 A20 20 0 0 1 433 246 Z" fill="#F2C94C"/>
    <circle cx="460" cy="255" r="20" fill="#EAF2EF"/><path d="M460 255 L460 235 A20 20 0 1 1 442 246 Z" fill="#3E8A76"/>
  </g>

  <!-- person -->
  <g>
    <rect x="250" y="320" width="80" height="110" rx="22" fill="#F2C94C"/>
    <circle cx="290" cy="292" r="28" fill="#EBB98F"/>
    <path d="M262 288 C 262 262 318 262 318 288 C 318 274 306 268 290 268 C 274 268 262 274 262 288 Z" fill="#2E6E5E"/>
    <path d="M256 350 C 226 340 214 300 205 275" fill="none" stroke="#EBB98F" stroke-width="13" stroke-linecap="round"/>
    <path d="M324 350 C 360 342 380 300 388 278" fill="none" stroke="#EBB98F" stroke-width="13" stroke-linecap="round"/>
  </g>
