<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="OOVA Ads flow: supply partners to platform to conversions" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164438"/>
      <stop offset="1" stop-color="#0F3529"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EAF2EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3E8A76" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3E8A76" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="8" y="8" width="1184" height="464" rx="28" fill="url(#panel)"/>

  <!-- section labels -->
  <text x="70" y="54" fill="#7FD1B9" font-size="17" font-weight="700" letter-spacing="2">SUPPLY PARTNERS</text>
  <text x="770" y="52" fill="#9FC9BC" font-size="15" font-weight="500">Multi-layer anti-fraud &amp; AI automation</text>
  <text x="770" y="73" fill="#9FC9BC" font-size="15" font-weight="500">boost your campaign performance</text>

  <!-- ===== connector paths (drawn first, behind) ===== -->
  <g fill="none" stroke="#2E6E5E" stroke-width="2" opacity=".7">
    <path id="sp1" d="M235,104 C 360,104 385,240 508,240"/>
    <path id="sp2" d="M235,160 C 360,160 390,240 508,240"/>
    <path id="sp3" d="M235,216 C 380,216 420,240 508,240"/>
    <path id="sp4" d="M235,272 C 380,272 420,240 508,240"/>
    <path id="sp5" d="M235,328 C 360,328 390,240 508,240"/>
    <path id="sp6" d="M235,384 C 360,384 385,240 508,240"/>
  </g>
  <path id="conv" d="M916,240 C 945,240 962,240 983,240" fill="none" stroke="#7FD1B9" stroke-width="2.5" opacity=".85" stroke-dasharray="2 7" stroke-linecap="round"/>

  <!-- ===== supply pills ===== -->
  <g font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">
    <g>
      <rect x="70" y="82"  width="165" height="44" rx="22" fill="#2E6E5E"/>
      <text x="152" y="110">In-App</text>
    </g>
    <g>
      <rect x="70" y="138" width="165" height="44" rx="22" fill="#2E6E5E"/>
      <text x="152" y="166">Paid Social</text>
    </g>
    <g>
      <rect x="70" y="194" width="165" height="44" rx="22" fill="#2E6E5E"/>
      <text x="152" y="222">Display</text>
    </g>
    <g>
      <rect x="70" y="250" width="165" height="44" rx="22" fill="#2E6E5E"/>
      <text x="152" y="278">Tier-1 DSP</text>
    </g>
    <g>
      <rect x="70" y="306" width="165" height="44" rx="22" fill="#2E6E5E"/>
      <text x="152" y="334">Premium Web</text>
    </g>
    <g>
      <rect x="70" y="362" width="165" height="44" rx="22" fill="#2E6E5E"/>
      <text x="152" y="390">Organic Social</text>
    </g>
  </g>

  <!-- ===== flowing dots: supply -> hub ===== -->
  <g fill="#7FD1B9">
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"   ><mpath href="#sp1"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s" ><mpath href="#sp2"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.8s" ><mpath href="#sp3"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s" ><mpath href="#sp4"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s" ><mpath href="#sp5"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="2.0s" ><mpath href="#sp6"/></animateMotion></circle>
  </g>

  <!-- ===== center hub ===== -->
  <circle cx="600" cy="240" r="150" fill="url(#glow)"/>
  <circle cx="600" cy="240" r="94" fill="url(#hub)" filter="url(#soft)"/>
  <!-- OOVA overlapping rings from logo -->
  <g fill="none" stroke-width="9">
    <circle cx="585" cy="222" r="27" stroke="#2E6E5E"/>
    <circle cx="612" cy="222" r="27" stroke="#1B1B1B"/>
  </g>
  <text x="600" y="285" text-anchor="middle" fill="#1B1B1B" font-size="20" font-weight="800" letter-spacing="1">OOVA</text>
  <text x="600" y="303" text-anchor="middle" fill="#2E6E5E" font-size="10" font-weight="700" letter-spacing="3">ADS</text>

  <!-- ===== satellite nodes ===== -->
  <!-- links (start exactly on hub edge, end on node edge) -->
  <g stroke="#3E8A76" stroke-width="2.5" opacity=".85">
    <line x1="683" y1="196" x2="731" y2="171"/>
    <line x1="694" y1="240" x2="828" y2="240"/>
    <line x1="683" y1="284" x2="731" y2="309"/>
  </g>

  <!-- Anti-fraud (label above) -->
  <g transform="translate(770,150)">
    <circle r="44" fill="#EAF2EF"/>
    <path d="M0,-22 L18,-14 V4 C18,17 0,24 0,24 C0,24 -18,17 -18,4 V-14 Z" fill="none" stroke="#2E6E5E" stroke-width="3"/>
    <path d="M-7,0 L-2,6 L8,-7" fill="none" stroke="#2E6E5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="-56" text-anchor="middle" fill="#EAF2EF" font-size="15" font-weight="700">Anti-Fraud</text>
  </g>

  <!-- Performance (rightmost, label below, clear of AI Tech) -->
  <g transform="translate(872,240)">
    <circle r="44" fill="#EAF2EF"/>
    <path d="M-16,10 L-6,-2 L2,6 L16,-12" fill="none" stroke="#2E6E5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="-12" r="3.5" fill="#2E6E5E"/>
    <text y="62" text-anchor="middle" fill="#EAF2EF" font-size="15" font-weight="700">Performance</text>
  </g>

  <!-- AI Tech (label below) -->
  <g transform="translate(770,330)">
    <circle r="44" fill="#EAF2EF"/>
    <g fill="none" stroke="#2E6E5E" stroke-width="3" stroke-linecap="round">
      <circle cx="0" cy="0" r="9"/>
      <line x1="0" y1="-9" x2="0" y2="-18"/><line x1="0" y1="9" x2="0" y2="18"/>
      <line x1="-9" y1="0" x2="-18" y2="0"/><line x1="9" y1="0" x2="18" y2="0"/>
      <line x1="6.4" y1="6.4" x2="13" y2="13"/><line x1="-6.4" y1="-6.4" x2="-13" y2="-13"/>
      <line x1="6.4" y1="-6.4" x2="13" y2="-13"/><line x1="-6.4" y1="6.4" x2="-13" y2="13"/>
    </g>
    <text y="60" text-anchor="middle" fill="#EAF2EF" font-size="15" font-weight="700">AI Tech</text>
  </g>

  <!-- flowing dots: hub -> conversions -->
  <g fill="#EAF2EF">
    <circle r="4.5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"  ><mpath href="#conv"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.6s"><mpath href="#conv"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.2s"><mpath href="#conv"/></animateMotion></circle>
  </g>

  <!-- ===== conversions box ===== -->
  <g transform="translate(985,180)">
    <rect x="0" y="0" width="160" height="120" rx="18" fill="#ffffff" filter="url(#soft)"/>
    <!-- funnel -->
    <path d="M55,30 L105,30 L88,58 L88,80 L72,88 L72,58 Z" fill="none" stroke="#2E6E5E" stroke-width="3" stroke-linejoin="round"/>
    <text x="80" y="108" text-anchor="middle" fill="#1B1B1B" font-size="17" font-weight="800">Conversions</text>
  </g>
  <text x="1065" y="330" text-anchor="middle" fill="#9FC9BC" font-size="14" font-weight="500">Quality users,</text>
  <text x="1065" y="348" text-anchor="middle" fill="#9FC9BC" font-size="14" font-weight="500">at the right cost</text>
</svg>
